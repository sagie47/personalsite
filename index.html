<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Retro Terminal Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
      
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Courier New', Courier, monospace;
        background-color: #000;
        /* Mobile Touch Optimization */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      
      /* CRT Text Glow */
      .retro-text {
        text-shadow: 0 0 2px rgba(255, 31, 173, 0.4), 0 0 4px rgba(255, 31, 173, 0.2);
      }

      .retro-cursor-block {
        display: block;
        width: 1ch;
        height: 1.3em;
        background-color: #ff1fad;
        animation: blink 1s step-end infinite;
        mix-blend-mode: difference;
        pointer-events: none;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* CRT Flicker */
      @keyframes flicker {
        0% { opacity: 0.97; }
        5% { opacity: 0.95; }
        10% { opacity: 0.9; }
        15% { opacity: 0.95; }
        20% { opacity: 0.99; }
        25% { opacity: 0.95; }
        30% { opacity: 0.9; }
        35% { opacity: 0.96; }
        40% { opacity: 0.98; }
        45% { opacity: 0.95; }
        50% { opacity: 0.99; }
        55% { opacity: 0.93; }
        60% { opacity: 0.9; }
        65% { opacity: 0.96; }
        70% { opacity: 1; }
        75% { opacity: 0.97; }
        80% { opacity: 0.95; }
        85% { opacity: 0.92; }
        90% { opacity: 0.98; }
        95% { opacity: 0.95; }
        100% { opacity: 0.98; }
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.02);
        z-index: 50;
      }

      /* Scanline Overlay */
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 31, 173, 0.1) 50%, rgba(0,0,0,0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 10s linear infinite;
        pointer-events: none;
      }

      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      /* Scrollbar styling for the terminal */
      .terminal-scroll::-webkit-scrollbar {
        width: 12px;
        background: #000;
      }
      .terminal-scroll::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #000;
      }
      .terminal-scroll::-webkit-scrollbar-corner {
        background: #000;
      }

      /* Retro Grid Background */
      .retro-grid {
        background-image: 
          linear-gradient(rgba(255, 31, 173, 0.2) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 31, 173, 0.2) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: center bottom;
        transform: perspective(500px) rotateX(20deg) scale(1.5);
        transform-origin: center bottom;
        opacity: 0.3;
        mask-image: linear-gradient(to bottom, transparent 0%, black 60%);
      }
    </style>
